<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f1">
  <title>Log in — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page-loader" id="page-loader" role="status" aria-label="Loading Stackly">
    <img src="stackly-logo-transparent.png" alt="Stackly" class="loader-logo">
    <span class="loader-bar"><i></i></span>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <main class="auth-page">
    <section class="auth-visual" aria-label="Fresh food from local kitchens">
      <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=3840&q=90" alt="Fresh ingredients and a meal being prepared" fetchpriority="high">
      <a class="brand" href="index.html" aria-label="Stackly home"><img src="stackly-logo-transparent.png" alt="Stackly"></a>
      <div class="auth-message"><span>A GOOD MEAL IS CLOSER THAN YOU THINK</span><h2>Welcome back<br>to the good stuff.</h2><p>Your favorite local flavors are just around the corner.</p></div>
    </section>
    <section class="auth-panel">
      <div class="auth-form-wrap">
        <div class="auth-top"><a class="brand" href="index.html" aria-label="Stackly home"><img src="stackly-logo-transparent.png" alt="Stackly"></a><a class="back-home" href="index.html">← Back to home</a></div>
        <h1>Welcome back</h1>
        <p class="auth-intro">Log in to pick up where your cravings left off.</p>
        <form class="auth-form" data-auth="login">
          <label class="field">Email address<input name="email" type="email" placeholder="you@example.com" autocomplete="email" required></label>
          <label class="field">Password<input name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></label>
          <div class="auth-options"><label class="remember"><input type="checkbox" name="remember"> Keep me logged in</label><a href="signup.html">Need an account?</a></div>
          <button class="button button-dark auth-submit" type="submit">Log in <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch">New to Stackly? <a href="signup.html">Create an account</a></p>
      </div>
    </section>
  </main>
</body>
</html>
